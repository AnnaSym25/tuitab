name: Build Windows Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Îți permite să pornești acțiunea manual din browser

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tuitab Windows Build"
          files: target/release/tuitab.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
